services:
  - type: web
    name: truthtrace-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://sham-b.github.io
      - key: DEMO_MODE
        value: "1"
      - key: LOW_MEMORY
        value: "1"
      - key: DISABLE_OCR
        value: "1"
      - key: LLM_PROVIDER
        value: none
      - key: WEB_CONCURRENCY
        value: "1"
